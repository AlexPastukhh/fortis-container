name: Fortis Release Impact v1
description: Read-only, exact-head Pull Request Release Impact and Build Target Catalog validation
runs:
  using: composite
  steps:
    - name: Install shared schema validation dependencies
      shell: bash
      env:
        FORTIS_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --disable-pip-version-check -r "$FORTIS_ACTION_PATH/../../../tools/release/requirements.txt"
    - name: Validate exact-head PR and complete Git diff against project catalog
      shell: bash
      env:
        FORTIS_ACTION_PATH: ${{ github.action_path }}
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        python "$FORTIS_ACTION_PATH/../../../tools/release/ci_entry.py"
