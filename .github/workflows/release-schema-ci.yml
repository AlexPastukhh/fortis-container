name: Release schema source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-schema:
    name: release-schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema-only test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/release/requirements.txt
      - name: Run offline validation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c "import yaml, jsonschema; print('YAML and JSON Schema dependencies available')"
          python -m unittest discover -s tests -p 'test_release_validator*.py' -v
          python -m unittest discover -s tests -p 'test_registry*.py' -v
